name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zsh: ${{ steps.filter.outputs.zsh }}
      pwsh: ${{ steps.filter.outputs.pwsh }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            zsh:
              - 'zsh/**'
              - 'install.sh'
              - '.github/workflows/ci.yml'
            pwsh:
              - 'powershell/**'
              - 'install.ps1'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/**'
              - 'shared/**'

  zsh-linux:
    needs: changes
    if: needs.changes.outputs.zsh == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh shellcheck
      - name: Smoke and Unit tests
        working-directory: zsh
        run: |
          ZSH_PROFILE_TEST_DEPS="${GITHUB_WORKSPACE}/test-deps"
          export ZSH_PROFILE_TEST_DEPS
          ./tests/run.sh
      - name: ShellCheck
        run: |
          shellcheck install.sh
          shellcheck zsh/install.sh
          shellcheck zsh/tests/bootstrap.sh
          shellcheck zsh/tests/run.sh

  zsh-macos:
    needs: changes
    if: needs.changes.outputs.zsh == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Syntax checks
        run: |
          find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 | xargs -0 zsh -n
          find zsh -type f -name '*.sh' -print0 | xargs -0 bash -n
          bash -n install.sh
      - name: Smoke and Unit tests
        working-directory: zsh
        run: |
          ZSH_PROFILE_TEST_DEPS="${GITHUB_WORKSPACE}/test-deps"
          export ZSH_PROFILE_TEST_DEPS
          ./tests/run.sh
      - name: ShellCheck
        run: |
          shellcheck install.sh
          shellcheck zsh/install.sh
          shellcheck zsh/tests/bootstrap.sh
          shellcheck zsh/tests/run.sh

  pwsh-windows:
    needs: changes
    if: needs.changes.outputs.pwsh == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: powershell
    steps:
      - uses: actions/checkout@v7
      - name: Setup PowerShell Profile (CI style)
        run: |
          $ErrorActionPreference = 'Stop'
          $ProfileDir = Split-Path -Parent $PROFILE
          if (-not (Test-Path $ProfileDir)) {
            New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
          }
          Copy-Item -Path ./Microsoft.PowerShell_profile.ps1 -Destination $PROFILE -Force
          Copy-Item -Path ./modules -Destination $ProfileDir -Recurse -Force
      - name: PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          $module = Get-Module -ListAvailable PSScriptAnalyzer
          if (-not $module) {
            Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors) {
            Write-Host "##[error]$($errors.Count) PSScriptAnalyzer error(s) found:"
            $errors | Format-Table -AutoSize
            exit 1
          }
      - name: Unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Unit.Tests.ps1 -Verbose
      - name: CONFIG_PWSH7_THEME tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/ThemeOverride.Tests.ps1 -Verbose
      - name: Setup module tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Setup.Tests.ps1 -Verbose
      - name: Windows compatibility regressions (PowerShell 7)
        run: |
          & ./tests/WindowsCompatibility.Tests.ps1
      - name: Windows compatibility regressions (Windows PowerShell 5.1)
        shell: powershell
        working-directory: powershell
        run: |
          & ./tests/WindowsCompatibility.Tests.ps1
      - name: Profile behavioral tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Microsoft.PowerShell_profile.Tests.ps1 -Verbose
      - name: Post-install health check
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Test-ProfileInstallation.ps1 -Detailed

  docs-lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Shell scripts syntax
        run: |
          bash -n install.sh
          zsh -n zsh/.zshrc 2>/dev/null || true

  ci-gate:
    name: ci-gate
    needs: [changes, zsh-linux, zsh-macos, pwsh-windows, docs-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Gate Status
        run: |
          results='${{ toJSON(needs) }}'
          echo "Evaluating CI Gate across all jobs:"
          echo "$results"
          
          # Se qualquer job dependente falhou ou foi cancelado, falhar o gate
          if echo "$results" | grep -q '"result": *"failure"'; then
            echo "::error::CI Gate FAILED: One or more dependent jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": *"cancelled"'; then
            echo "::error::CI Gate CANCELLED: One or more dependent jobs were cancelled."
            exit 1
          fi
          
          echo "CI Gate PASSED: All triggered suites succeeded (or skipped cleanly)."

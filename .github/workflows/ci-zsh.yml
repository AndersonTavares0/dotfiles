name: CI - Zsh Profile

on:
  push:
    branches: [main]
    paths:
      - 'zsh/**'
      - 'install.sh'
      - '.github/workflows/ci-zsh.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zsh/**'
      - 'install.sh'
      - '.github/workflows/ci-zsh.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck

      - name: Smoke tests
        working-directory: zsh
        run: |
          ZSH_PROFILE_TEST_DEPS="${GITHUB_WORKSPACE}/test-deps"
          export ZSH_PROFILE_TEST_DEPS
          ./tests/run.sh

      - name: ShellCheck
        run: |
          shellcheck install.sh
          shellcheck zsh/install.sh
          shellcheck zsh/tests/bootstrap.sh
          shellcheck zsh/tests/run.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck

      - name: Syntax checks
        run: |
          find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 | xargs -0 zsh -n
          find zsh -type f -name '*.sh' -print0 | xargs -0 bash -n
          bash -n install.sh

      - name: Smoke tests
        working-directory: zsh
        run: |
          ZSH_PROFILE_TEST_DEPS="${GITHUB_WORKSPACE}/test-deps"
          export ZSH_PROFILE_TEST_DEPS
          ./tests/run.sh

      - name: ShellCheck
        run: |
          shellcheck install.sh
          shellcheck zsh/install.sh
          shellcheck zsh/tests/bootstrap.sh
          shellcheck zsh/tests/run.sh
